<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - KleanMark</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--background);
      padding: 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .auth-card img {
      height: 48px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div class="card auth-card">
    <img src="assets/images/Logo.svg" alt="KleanMark Logo">
    <h2>Update Password</h2>
    <p>Enter the 8-digit OTP code and your new password.</p>
    
    <form id="resetForm" style="text-align: left;">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" required readonly>
      </div>
      <div class="form-group">
        <label class="form-label">8-Digit OTP</label>
        <input type="text" id="otp" class="form-control" required placeholder="12345678" maxlength="8">
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" id="new_password" class="form-control" required placeholder="••••••••" minlength="6" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{6,}" title="Must contain at least one number, one uppercase and lowercase letter, and one special character, and at least 6 or more characters">
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Reset Password</button>
    </form>
  </div>

  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script>
    // Auto-fill email if passed from previous page
    const storedEmail = sessionStorage.getItem('resetEmail');
    if (storedEmail) {
      document.getElementById('email').value = storedEmail;
    } else {
      document.getElementById('email').removeAttribute('readonly');
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const otp_code = document.getElementById('otp').value.trim();
      const new_password = document.getElementById('new_password').value;
      
      try {
        await fetchAPI('/vendors/reset-password', {
          method: 'POST',
          body: JSON.stringify({ email, otp_code, new_password })
        });
        showToast('Password reset successfully!', 'success');
        
        sessionStorage.removeItem('resetEmail');
        
        setTimeout(() => {
          window.location.href = 'vendor-login.html';
        }, 1500);
      } catch (error) {
        // fetchAPI displays the toast error
      }
    });
  </script>
</body>
</html>
