<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — KleanMark</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="stylesheet" href="css/global.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background);
      padding: 24px 16px;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,200,83,0.12) 0%, transparent 70%);
      top: -100px; right: -100px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(105,240,174,0.08) 0%, transparent 70%);
      bottom: -80px; left: -80px;
      pointer-events: none;
    }

    .reset-wrap {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .reset-card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
    }

    .reset-logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }
    .reset-logo { height: 40px; }

    .reset-icon {
      width: 64px; height: 64px;
      background: var(--primary-pale);
      border: 2px solid rgba(0,200,83,0.2);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto 24px;
    }

    .reset-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 8px;
    }
    .reset-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .otp-hint {
      background: var(--primary-pale);
      border: 1px solid rgba(0,200,83,0.2);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.8rem;
      color: var(--primary-dark);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    input[readonly] {
      background: var(--background) !important;
      cursor: not-allowed;
      color: var(--text-secondary);
    }

    .password-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="reset-wrap">
    <div class="reset-card">
      <div class="reset-logo-wrap">
        <img src="assets/images/Logo.svg" alt="KleanMark" class="reset-logo">
      </div>

      <div class="reset-icon">🔒</div>
      <h2 class="reset-title">Set New Password</h2>
      <p class="reset-desc">Enter the 8-digit OTP code you received and choose a strong new password.</p>

      <div class="otp-hint">
        📧 OTP sent to your registered email. It may take a minute. Check your spam folder if needed.
      </div>

      <form id="resetForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" required readonly autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">8-Digit OTP</label>
          <input type="text" id="otp" class="form-control" required placeholder="12345678" maxlength="8"
            style="letter-spacing: 4px; font-size: 1.1rem; font-weight: 600;" autocomplete="one-time-code">
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" id="new_password" class="form-control" required placeholder="••••••••" minlength="6">
          <div class="password-hint">Minimum 6 characters.</div>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
          Reset Password
        </button>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script>
    // Auto-fill email if passed from previous page
    const storedEmail = sessionStorage.getItem('resetEmail');
    if (storedEmail) {
      document.getElementById('email').value = storedEmail;
    } else {
      document.getElementById('email').removeAttribute('readonly');
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const otp_code = document.getElementById('otp').value.trim();
      const new_password = document.getElementById('new_password').value;
      try {
        await fetchAPI('/vendors/reset-password', {
          method: 'POST',
          body: JSON.stringify({ email, otp_code, new_password })
        });
        showToast('Password reset successfully!', 'success');
        sessionStorage.removeItem('resetEmail');
        setTimeout(() => {
          window.location.href = 'vendor-login.html';
        }, 1500);
      } catch (error) {
        // fetchAPI displays the toast error
      }
    });
  </script>
</body>
</html>
