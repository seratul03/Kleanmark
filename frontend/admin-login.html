<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — KleanMark Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="admin-login-page">
    <!-- Background orbs -->
    <div class="admin-orb admin-orb-1"></div>
    <div class="admin-orb admin-orb-2"></div>
    <div class="admin-orb admin-orb-3"></div>

    <!-- Grid pattern overlay -->
    <div class="admin-grid-overlay"></div>

    <div class="admin-login-wrap">

      <!-- Logo + Badge -->
      <div class="admin-login-brand">
        <img src="assets/images/Logo.svg" alt="KleanMark" class="admin-login-logo">
        <div class="admin-login-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          Restricted Access
        </div>
      </div>

      <!-- Login Card -->
      <div class="admin-login-card">
        <div class="admin-login-icon">🛡️</div>
        <h1 class="admin-login-title">Control Panel</h1>
        <p class="admin-login-subtitle">KleanMark Administrator Portal. Authorized personnel only.</p>

        <form id="adminLoginForm">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" id="username" class="form-control" required placeholder="admin"
              autocomplete="username" style="font-weight:600; letter-spacing:0.5px;">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required placeholder="••••••••"
              autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-dark" style="margin-top: 8px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Authenticate &amp; Enter
          </button>
        </form>

        <div style="margin-top: 24px; text-align: center;">
          <a href="index.html" style="color: rgba(255,255,255,0.4); font-size: 0.8rem; text-decoration: none; transition: color 0.2s;"
            onmouseover="this.style.color='rgba(105,240,174,0.8)'" onmouseout="this.style.color='rgba(255,255,255,0.4)'">
            ← Return to Public Site
          </a>
        </div>
      </div>

      <div class="admin-login-footer">
        KleanMark © 2026 · Internal System · All access logged
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
