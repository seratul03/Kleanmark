<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — KleanMark</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="stylesheet" href="css/global.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background);
      padding: 24px 16px;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,200,83,0.12) 0%, transparent 70%);
      top: -100px; right: -100px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(105,240,174,0.08) 0%, transparent 70%);
      bottom: -80px; left: -80px;
      pointer-events: none;
    }

    .forgot-wrap {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .forgot-card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
    }

    .forgot-logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }
    .forgot-logo { height: 40px; }

    .forgot-icon {
      width: 64px; height: 64px;
      background: var(--primary-pale);
      border: 2px solid rgba(0,200,83,0.2);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto 24px;
    }

    .forgot-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 8px;
    }
    .forgot-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      justify-content: center;
      margin-top: 24px;
    }
    .back-link:hover { text-decoration: underline; }

    .info-box {
      background: var(--primary-pale);
      border: 1px solid rgba(0,200,83,0.2);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.8rem;
      color: var(--primary-dark);
      margin-bottom: 24px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="forgot-wrap">
    <div class="forgot-card">
      <div class="forgot-logo-wrap">
        <img src="assets/images/Logo.svg" alt="KleanMark" class="forgot-logo">
      </div>

      <div class="forgot-icon">🔑</div>
      <h2 class="forgot-title">Reset Password</h2>
      <p class="forgot-desc">Enter your registered email address and we'll send an 8-digit OTP code to reset your password.</p>

      <div class="info-box">
        💡 After submission, check your email inbox (and spam folder). You'll be redirected to enter the OTP automatically.
      </div>

      <form id="forgotForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" required placeholder="owner@restaurant.com" autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
          Send OTP Code
        </button>
      </form>

      <a href="vendor-login.html" class="back-link">
        ← Back to Login
      </a>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      try {
        await fetchAPI('/vendors/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email })
        });
        showToast('OTP sent successfully! Check server logs.', 'success');
        sessionStorage.setItem('resetEmail', email);
        setTimeout(() => {
          window.location.href = 'vendor-reset-password.html';
        }, 1500);
      } catch (error) {
        showToast('Failed to request reset.', 'error');
      }
    });
  </script>
</body>
</html>
