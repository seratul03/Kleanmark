<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - KleanMark</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--background);
      padding: 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .auth-card img {
      height: 48px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div class="card auth-card">
    <img src="assets/images/Logo.svg" alt="KleanMark Logo">
    <h2>Reset Password</h2>
    <p>Enter your registered email address to receive an 8-digit OTP code.</p>
    
    <form id="forgotForm" style="text-align: left;">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" required placeholder="owner@restaurant.com">
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Send OTP</button>
    </form>
    
    <p style="margin-top: 24px; font-size: 0.875rem;">
      <a href="vendor-login.html" style="color: var(--primary); text-decoration: none;">Back to Login</a>
    </p>
  </div>

  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      
      try {
        await fetchAPI('/vendors/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email })
        });
        showToast('OTP sent successfully! Check server logs.', 'success');
        
        sessionStorage.setItem('resetEmail', email);
        
        setTimeout(() => {
          window.location.href = 'vendor-reset-password.html';
        }, 1500);
      } catch (error) {
        showToast('Failed to request reset.', 'error');
      }
    });
  </script>
</body>
</html>
